<?xml version="1.0" encoding="UTF-8"?>
<!--
  xmwidget - monochrome headset-with-boom-mic icon for the xm Plasma applet.

  Deliberately one solid colour (black) so the applet can tint it per state
  (blue = A2DP music, green = HFP call, grey = headset off, amber = busy).
  Geometry is authored on a 24x24 grid, the classic hicolor size, so it stays
  crisp when scaled down to a 22px panel icon.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24" viewBox="0 1 24 24">
  <g fill="none" stroke="#000000" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- headband: semicircle plus the two short stubs going down -->
    <path d="M5 13.6 V11.4 a7 7 0 0 1 14 0 v2.2"/>
    <!-- boom arm, dropping off the right cup -->
    <path d="M19.7 18.9 c0 2.1 -1.7 3.8 -3.7 3.8 h-4.8"/>
  </g>
  <g fill="#000000">
    <!-- left ear cushion -->
    <rect x="1.3" y="12.2" width="5.6" height="8.2" rx="2.6"/>
    <!-- right ear cushion -->
    <rect x="17.1" y="12.2" width="5.6" height="8.2" rx="2.6"/>
    <!-- microphone tip -->
    <circle cx="10.2" cy="22.0" r="1.9"/>
  </g>
</svg>
