# ==============================================================================
# 51-bt-calls.conf - Bluetooth headset meeting fix
# ==============================================================================
# Drop-in for WirePlumber. Installs to:
#   ~/.config/wireplumber/wireplumber.conf.d/51-bt-calls.conf
# Verified on CachyOS / Arch with PipeWire 1.6.x + WirePlumber 0.5.x.
#
# Problem this fixes (Sony XM-series & other Bluetooth headsets):
#   - A2DP/LDAC has no microphone. A meeting (Teams/Zoom/WebRTC) forces an
#     A2DP <-> HFP switch. With autoswitch ON, WirePlumber flips to HFP the
#     instant an app *probes* the mic, causing repeated mid-call renegotiation
#     ("audio cuts out many times"). On some headsets (e.g. Sony WH-1000XM5)
#     that switch can also die halfway, leaving a silent-but-"connected" mic
#     ("people can't hear me").
#
# Fix:
#   - Turn OFF automatic switching, so the profile only changes when the user
#     explicitly switches it (see the companion `xm` command).
#   - Enable mSBC (wideband speech, 16 kHz) + hardware volume + SBC-XQ for HFP.
#
# Reversible: delete this file and run  systemctl --user restart wireplumber
# ==============================================================================

wireplumber.settings = {
  # Do NOT auto-jump to the headset (HFP) profile when a mic is requested.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # Wideband speech codec for HFP/HSP (better than 8 kHz CVSD).
  bluez5.enable-msbc = true
  # Let the headset's own volume control map to the system volume.
  bluez5.enable-hw-volume = true
  # Higher-quality SBC variant for A2DP when LDAC/AAC are not selected.
  bluez5.enable-sbc-xq = true
}
